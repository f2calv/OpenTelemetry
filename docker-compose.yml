# Starts the local Jaeger tracing backend.
# Published endpoints: Jaeger UI http://localhost:16686, OTLP gRPC localhost:4317,
# and OTLP HTTP localhost:4318.
services:
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
